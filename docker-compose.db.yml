version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: martha-ts-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: martha_ts_user
      POSTGRES_PASSWORD: martha_ts_password_dev
      POSTGRES_DB: martha_ts
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "21005:5432"
    volumes:
      - martha-ts-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U martha_ts_user -d martha_ts"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - martha-ts-network

  redis:
    image: redis:7-alpine
    container_name: martha-ts-redis
    restart: unless-stopped
    command: redis-server --requirepass password
    ports:
      - "20001:6379"
    volumes:
      - martha-ts-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "password", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - martha-ts-network

volumes:
  martha-ts-postgres-data:
    name: martha-ts-postgres-data
  martha-ts-redis-data:
    name: martha-ts-redis-data

networks:
  martha-ts-network:
    name: martha-ts-network
