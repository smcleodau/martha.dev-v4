  # Agent Sessions API

  /agents/sessions:
    get:
      tags:
        - Agents
      summary: List active sessions
      description: Retrieves all active agent sessions
      operationId: listAgentSessions
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentSessionListResponse'

    post:
      tags:
        - Agents
      summary: Start agent session
      description: Starts a new agent session for an issue
      operationId: startAgentSession
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - agent_type
                - issue_id
                - worktree
                - initial_task
              properties:
                agent_type:
                  type: string
                  enum: [coder, tester, reviewer, researcher, architect]
                issue_id:
                  type: string
                worktree:
                  type: string
                initial_task:
                  type: string
            example:
              agent_type: coder
              issue_id: issue-001
              worktree: martha-dev-v4
              initial_task: Implement workflow execution engine
      responses:
        '201':
          description: Agent session started
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentSession'

  /agents/sessions/{sessionId}:
    parameters:
      - name: sessionId
        in: path
        required: true
        schema:
          type: string

    get:
      tags:
        - Agents
      summary: Get agent session
      description: Retrieves agent session details
      operationId: getAgentSession
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentSession'

    patch:
      tags:
        - Agents
      summary: Update agent session
      description: Updates agent session progress or status
      operationId: updateAgentSession
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                progress:
                  type: number
                current_task:
                  type: string
                status:
                  type: string
                  enum: [active, paused]
      responses:
        '200':
          description: Session updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentSession'

  /agents/sessions/{sessionId}/end:
    parameters:
      - name: sessionId
        in: path
        required: true
        schema:
          type: string

    post:
      tags:
        - Agents
      summary: End agent session
      description: Ends an agent session with a final status
      operationId: endAgentSession
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - status
              properties:
                status:
                  type: string
                  enum: [completed, failed]
                summary:
                  type: string
                  description: Summary of work completed
            example:
              status: completed
              summary: Successfully implemented workflow execution engine
      responses:
        '200':
          description: Session ended
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentSession'

